name: Test CUDA Toolkit primitive reference

# This workflow compiles the optional CUB/CUDART comparison provider. It never
# publishes or uploads a runtime wheel; the standard runtime release remains
# driver-only and is owned by publish_runtime_pypi.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test_cuda_toolkit_reference.yml"
      - "cmake/TaichiCore.cmake"
      - "packaging/runtime/**"
      - "scripts/repair_runtime_wheel.py"
      - "scripts/validate_runtime_wheel.py"
      - "scripts/validate_source_provider.py"
      - "taichi/rhi/cuda/**"
      - "python/taichi_forge/hardware/_cub_source_provider.py"
      - "python/taichi_forge/hardware/_source_provider.py"
      - "python/taichi_forge/hardware/source_providers/cub/**"
      - "python/taichi_forge/hardware/source_providers/_cuda_build.py"
      - "tests/python/test_hardware_source_provider.py"

permissions:
  contents: read

env:
  TI_SKIP_VERSION_CHECK: "ON"
  TI_CI: "1"
  CUDA_TOOLKIT_VERSION: "13.2.0"
  LLVM20_WIN_URL: ${{ vars.LLVM20_WIN_URL }}
  LLVM20_LINUX_URL: ${{ vars.LLVM20_LINUX_URL || vars.LLVM20_LINUX_MANYLINUX_URL }}
  LLVM20_WIN_SHA256: ${{ vars.LLVM20_WIN_SHA256 }}
  LLVM20_LINUX_SHA256: ${{ vars.LLVM20_LINUX_SHA256 }}
  CMAKE_ARGS: >-
    -DTI_WITH_VULKAN:BOOL=OFF
    -DTI_WITH_OPENGL:BOOL=OFF
    -DTI_WITH_CUDA:BOOL=ON
    -DTI_WITH_CUDA_TOOLKIT:BOOL=OFF
    -DTI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=ON
    -DTI_CUDA_CUB_SORT_DYNAMIC_CUDART:BOOL=ON
    -DTI_WITH_CUPTI:BOOL=OFF
    -DTI_WITH_LLVM:BOOL=ON
    -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
    -DTI_WITH_C_API:BOOL=OFF
    -DTI_BUILD_TESTS:BOOL=OFF

jobs:
  build_linux_reference:
    name: Linux reference compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # This optional provider and its runtime wheel are ABI-independent;
          # use the same tooling host as the production runtime workflow.
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build libtinfo-dev libxml2-dev
          python -m pip install "pip==26.2.1"
          python -m pip install --requirement packaging/constraints/release-build.txt

      - name: Install CUDA Toolkit reference compiler
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: linux-reference.txt

      - name: Compile standalone CUB source provider
        run: |
          set -euo pipefail
          python python/taichi_forge/hardware/source_providers/cub/build.py \
            --output dist-source-provider \
            --target-code sm_80,compute_80
          python scripts/validate_source_provider.py \
            --manifest dist-source-provider/cub_source_provider.json \
            --platform linux --output dist-source-provider/build-audit.json

      - name: Download prebuilt LLVM 20
        run: |
          set -euo pipefail
          test -n "$LLVM20_LINUX_URL"
          test "${#LLVM20_LINUX_SHA256}" -eq 64
          mkdir -p dist/taichi-llvm-20
          curl -fsSL "$LLVM20_LINUX_URL" -o /tmp/llvm20.zip
          echo "${LLVM20_LINUX_SHA256,,}  /tmp/llvm20.zip" | sha256sum -c -
          python -m zipfile -e /tmp/llvm20.zip dist/taichi-llvm-20
          echo "LLVM_DIR=$GITHUB_WORKSPACE/dist/taichi-llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Compile reference runtime wheel without publishing it
        run: |
          set -euo pipefail
          nvcc -V
          python -I -m build --wheel --no-isolation \
            --outdir dist-reference packaging/runtime
          build_dir="$(find _skbuild -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/CMakeCache.txt' \; -print)"
          test -n "$build_dir"
          python scripts/repair_runtime_wheel.py \
            --wheel-dir dist-reference --platform linux --build-dir "$build_dir"
          python scripts/validate_runtime_wheel.py \
            --wheel-dir dist-reference --platform linux \
            --dependency-class toolkit-reference --cuda-major 13

  build_windows_reference:
    name: Windows reference compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The CPython-specific shim is not built in this workflow.
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --requirement packaging/constraints/release-build.txt

      - name: Install CUDA Toolkit reference compiler
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: windows-reference.txt

      - name: Compile standalone CUB source provider
        shell: pwsh
        run: |
          python python/taichi_forge/hardware/source_providers/cub/build.py `
            --output dist-source-provider `
            --target-code sm_80,compute_80
          if ($LASTEXITCODE -ne 0) { throw "CUB addon compilation failed." }
          python scripts/validate_source_provider.py `
            --manifest dist-source-provider/cub_source_provider.json `
            --platform windows --output dist-source-provider/build-audit.json
          if ($LASTEXITCODE -ne 0) { throw "CUB addon dependency audit failed." }

      - name: Download prebuilt LLVM 20
        shell: pwsh
        run: |
          if (-not $env:LLVM20_WIN_URL) {
            throw "LLVM20_WIN_URL is not configured."
          }
          $expectedHash = ($env:LLVM20_WIN_SHA256).ToLowerInvariant()
          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            throw "LLVM20_WIN_SHA256 is not configured."
          }
          New-Item -ItemType Directory -Force -Path dist/taichi-llvm-20 | Out-Null
          Invoke-WebRequest -Uri $env:LLVM20_WIN_URL -OutFile $env:TEMP/llvm20.zip
          $actualHash = (Get-FileHash -Algorithm SHA256 $env:TEMP/llvm20.zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM 20 SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Expand-Archive -Path $env:TEMP/llvm20.zip -DestinationPath dist/taichi-llvm-20
          "LLVM_DIR=$(Resolve-Path dist/taichi-llvm-20/lib/cmake/llvm)" |
            Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Compile reference runtime wheel without publishing it
        shell: pwsh
        run: |
          nvcc -V
          python -I -m build --wheel --no-isolation `
            --outdir dist-reference packaging/runtime
          $buildDirs = @(Get-ChildItem -Path _skbuild -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "CMakeCache.txt")
          })
          if ($buildDirs.Count -ne 1) {
            throw "Expected one reference build directory, found $($buildDirs.Count)."
          }
          python scripts/repair_runtime_wheel.py `
            --wheel-dir dist-reference --platform windows `
            --build-dir $buildDirs[0].FullName
          python scripts/validate_runtime_wheel.py `
            --wheel-dir dist-reference --platform windows `
            --dependency-class toolkit-reference --cuda-major 13
